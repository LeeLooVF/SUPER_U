    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let postersList = [
            {
                productName: 'APERIVRAIS ST AGUR 30%MG 100G',
                oldPrice: 2.31,
                baseUnitPrice: 23.10,
                unitQty: 0.100,
                unitType: 'kg',
                gencode: '000015561621'
            }
        ];

        let rawLeftImage = null;
        let trimmedLeftImage = null;
        let dateColor = '#FFFFFF';
        let showDate = false;
        let showDiscountText = true;

        const FONT_SLAB = '"Museo Slab", "Arvo", "Rockwell", serif';
        const FONT_SANS = '"Montserrat", Arial, sans-serif';

        // Gestion des polices personnalisées .OTF
        document.getElementById('inputCustomFonts').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const buffer = await file.arrayBuffer();
                const name = file.name.toLowerCase();
                let weight = '500';
                if (name.includes('900')) weight = '900';
                else if (name.includes('700')) weight = '700';
                const fontFace = new FontFace('Museo Slab', buffer, { weight });
                await fontFace.load();
                document.fonts.add(fontFace);
            }
            renderAllPosters();
        });

        // Bouton Afficher / Masquer la date
        const btnToggleDate = document.getElementById('btnToggleDate');
        const inputDates = document.getElementById('inputDates');
        btnToggleDate.addEventListener('click', () => {
            showDate = !showDate;
            if (showDate) {
                btnToggleDate.textContent = '👁️ Date affichée';
                btnToggleDate.className = 'text-[11px] font-bold px-2.5 py-1 rounded bg-green-100 text-green-800 border border-green-300 hover:bg-green-200 transition';
                inputDates.disabled = false;
                inputDates.classList.remove('opacity-50', 'bg-gray-100');
            } else {
                btnToggleDate.textContent = '🚫 Date masquée';
                btnToggleDate.className = 'text-[11px] font-bold px-2.5 py-1 rounded bg-red-100 text-red-800 border border-red-300 hover:bg-red-200 transition';
                inputDates.disabled = true;
                inputDates.classList.add('opacity-50', 'bg-gray-100');
            }
            renderAllPosters();
        });

        // Bouton Afficher / Masquer la phrase de mécanique
        const btnToggleDiscountText = document.getElementById('btnToggleDiscountText');
        const inputDiscountText = document.getElementById('inputDiscountText');
        btnToggleDiscountText.addEventListener('click', () => {
            showDiscountText = !showDiscountText;
            if (showDiscountText) {
                btnToggleDiscountText.textContent = 'affichée';
                btnToggleDiscountText.className = 'min-w-[88px] text-center text-[11px] font-bold px-3 py-0.5 rounded bg-green-100 text-green-800 border border-green-300 hover:bg-green-200 transition';
                inputDiscountText.disabled = false;
                inputDiscountText.classList.remove('opacity-50', 'bg-gray-100');
            } else {
                btnToggleDiscountText.textContent = 'masquée';
                btnToggleDiscountText.className = 'min-w-[88px] text-center text-[11px] font-bold px-3 py-0.5 rounded bg-red-100 text-red-800 border border-red-300 hover:bg-red-200 transition';
                inputDiscountText.disabled = true;
                inputDiscountText.classList.add('opacity-50', 'bg-gray-100');

        });

        // Couleur de la date
        const btnDateWhite = document.getElementById('btnDateWhite');
        const btnDateBlack = document.getElementById('btnDateBlack');

        btnDateWhite.addEventListener('click', () => {
            dateColor = '#FFFFFF';
            btnDateWhite.className = "flex-1 py-2 px-3 rounded-lg border-2 border-red-600 bg-gray-800 text-white text-xs font-bold flex items-center justify-center gap-1.5";
            btnDateBlack.className = "flex-1 py-2 px-3 rounded-lg border border-gray-300 bg-white text-gray-900 text-xs font-bold flex items-center justify-center gap-1.5";
            renderAllPosters();
        });

        btnDateBlack.addEventListener('click', () => {
            dateColor = '#000000';
            btnDateBlack.className = "flex-1 py-2 px-3 rounded-lg border-2 border-red-600 bg-gray-100 text-gray-900 text-xs font-bold flex items-center justify-center gap-1.5";
            btnDateWhite.className = "flex-1 py-2 px-3 rounded-lg border border-gray-300 bg-gray-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 opacity-70";
            renderAllPosters();
        });

        function autoTrimWhiteBorders(img) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            tempCtx.drawImage(img, 0, 0);

            const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imgData.data;
            const w = tempCanvas.width;
            const h = tempCanvas.height;

            let top = 0, bottom = h - 1, left = 0, right = w - 1;
            const isWhite = (x, y) => {
                const idx = (y * w + x) * 4;
                return data[idx + 3] < 15 || (data[idx] > 240 && data[idx + 1] > 240 && data[idx + 2] > 240);
            };

            topLoop: for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) { if (!isWhite(x, y)) { top = y; break topLoop; } }
            }
            bottomLoop: for (let y = h - 1; y >= top; y--) {
                for (let x = 0; x < w; x++) { if (!isWhite(x, y)) { bottom = y; break bottomLoop; } }
            }
            leftLoop: for (let x = 0; x < w; x++) {
                for (let y = top; y <= bottom; y++) { if (!isWhite(x, y)) { left = x; break leftLoop; } }
            }
            rightLoop: for (let x = w - 1; x >= left; x--) {
                for (let y = top; y <= bottom; y++) { if (!isWhite(x, y)) { right = x; break rightLoop; } }
            }

            const cropW = right - left + 1;
            const cropH = bottom - top + 1;
            if (cropW <= 20 || cropH <= 20) return img;

            const outCanvas = document.createElement('canvas');
            outCanvas.width = cropW;
            outCanvas.height = cropH;
            outCanvas.getContext('2d').drawImage(tempCanvas, left, top, cropW, cropH, 0, 0, cropW, cropH);

            const outImg = new Image();
            outImg.src = outCanvas.toDataURL('image/png');
            return outImg;
        }

        async function loadFileToPages(file) {
            if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const pages = [];
                for (let p = 1; p <= pdf.numPages; p++) {
                    const page = await pdf.getPage(p);
                    const scale = 3.0;
                    const viewport = page.getViewport({ scale });
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = viewport.width;
                    tempCanvas.height = viewport.height;
                    await page.render({ canvasContext: tempCtx, viewport }).promise;

                    let textItems = [];
                    try {
                        const textContent = await page.getTextContent();
                        textItems = textContent.items.map(item => {
                            const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                            return {
                                str: item.str.trim(),
                                x: tx[4],
                                y: tx[5]
                            };
                        }).filter(it => it.str.length > 0);
                    } catch (e) {}

                    pages.push({ canvas: tempCanvas, textItems });
                }
                return pages;
            } else {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const c = document.createElement('canvas');
                            c.width = img.width;
                            c.height = img.height;
                            c.getContext('2d').drawImage(img, 0, 0);
                            resolve([{ canvas: c, textItems: [] }]);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
        }

        // Sélection d'une image prédéfinie dans la liste déroulante
        document.getElementById('selectPresetLeftImage').addEventListener('change', function(e) {
            const fileName = e.target.value;
            if (!fileName) return;

            // Réinitialise l'input fichier libre pour montrer qu'on utilise le visuel prédéfini
            document.getElementById('inputLeftImage').value = '';

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                rawLeftImage = img;
                trimmedLeftImage = autoTrimWhiteBorders(rawLeftImage);
                trimmedLeftImage.onload = renderAllPosters;
                setTimeout(renderAllPosters, 80);
            };
            img.onerror = () => {
                alert(`Impossible de charger "${fileName}". Vérifie que le fichier est bien présent dans le même dossier que index.html.`);
            };
            img.src = encodeURI(fileName);
        });

        // Dépôt d'une image ou PDF au choix via le bouton parcourir
        document.getElementById('inputLeftImage').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Remet le menu déroulant sur "-- Choisir visuel --"
            document.getElementById('selectPresetLeftImage').value = '';

            const pages = await loadFileToPages(file);
            const img = new Image();
            img.onload = () => {
                rawLeftImage = img;
                trimmedLeftImage = autoTrimWhiteBorders(rawLeftImage);
                trimmedLeftImage.onload = renderAllPosters;
                setTimeout(renderAllPosters, 100);
            };
            img.src = pages[0].canvas.toDataURL('image/png');
        });

        document.getElementById('chkAutoTrim').addEventListener('change', renderAllPosters);

        function cleanProductFirstLine(rawLine) {
            if (!rawLine) return '';
            return rawLine
                .replace(/[|—_~«»"“”‘’]/g, ' ')
                .replace(/^[^A-Za-zÀ-ÿ0-9]+/, '')
                .replace(/[^A-Za-zÀ-ÿ0-9.%)+/-]+$/, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toUpperCase();
        }

        function isProductTitleCandidate(line) {
            if (!line || line.length < 4) return false;
            const clean = cleanProductFirstLine(line);
            if (clean.length < 4) return false;
            if (/^(CONT\b|PRIX\b|FICHIER\b|PORTABLE\b|COMMENTAIRES\b|SUPER\s+U\b|\d+\s*ÉTIQUETTES|\d+\s*ETIQUETTES)/i.test(clean)) return false;
            if (/^\d{5}\s+\d{6,}/.test(clean)) return false;
            if (/^\d{6}\s+\d{2,3}/.test(clean)) return false;
            if (/^\d{11,14}$/.test(clean.replace(/\s+/g, ''))) return false;
            if (/^\d+[.,€\s]*\d*€?$/.test(clean)) return false;
            const letters = (clean.match(/[A-ZÀ-Ý]/g) || []).length;
            return letters >= 3;
        }

        function parseSingleLabelBlock(blockText, topTitleText = '') {
            if (/fichier\s*portable|commentaires\s*:|etiq-ls/i.test(blockText)) {
                return null;
            }

            const rawLines = blockText
                .split('\n')
                .map(l => l.replace(/[|—_~«»]/g, ' ').replace(/\s+/g, ' ').trim())
                .filter(l => l.length >= 2);

            if (rawLines.length === 0 && !topTitleText) return null;

            let productName = '';

            if (topTitleText) {
                const topLines = topTitleText
                    .split('\n')
                    .map(l => cleanProductFirstLine(l))
                    .filter(isProductTitleCandidate);
                if (topLines.length > 0) {
                    productName = topLines[0];
                }
            }

            if (!productName) {
                let contIdx = rawLines.findIndex(l => /cont\s*[:.;]?\s*\d/i.test(l) || /\bprix\s+(pi[eè]ce|pl[eè]ce|kg|l)\b/i.test(l));
                const searchLimit = contIdx !== -1 ? contIdx : rawLines.length;
                for (let i = 0; i < searchLimit; i++) {
                    if (isProductTitleCandidate(rawLines[i])) {
                        productName = cleanProductFirstLine(rawLines[i]);
                        break;
                    }
                }
            }

            const fullText = rawLines.join(' \n ');

            let unitType = '';
            let unitQty = 0;

            if (/\bprix\s*(?:au\s*)?(?:kg|kilo)\b/i.test(fullText)) {
                unitType = 'kg';
            } else if (/\bprix\s*(?:au\s*)?(?:l|litre)\b/i.test(fullText)) {
                unitType = 'l';
            } else if (/\bprix\s*(?:pi[eè]ce|pl[eè]ce|piece|pce)\b/i.test(fullText)) {
                unitType = 'pièce';
            }

            const contMatch = fullText.match(/cont\s*[:.;]?\s*(\d+[.,]\d+)\s*(pi[eè]ce|pl[eè]ce|piece|pce|kg|l|g|gr|ml|cl)/i)
                           || fullText.match(/\b(\d+[.,]\d{3})\s*(pi[eè]ce|pl[eè]ce|piece|pce|kg|l)\b/i);
            if (contMatch) {
                const val = parseFloat(contMatch[1].replace(',', '.'));
                const u = contMatch[2].toLowerCase();
                if (u.startsWith('pi') || u.startsWith('pl') || u === 'pce') {
                    if (!unitType) unitType = 'pièce';
                    unitQty = val || 1;
                } else if (u === 'kg') {
                    if (!unitType) unitType = 'kg';
                    unitQty = val;
                } else if (u === 'g' || u === 'gr') {
                    if (!unitType) unitType = 'kg';
                    unitQty = val / 1000;
                } else if (u === 'l') {
                    if (!unitType) unitType = 'l';
                    unitQty = val;
                } else if (u === 'ml') {
                    if (!unitType) unitType = 'l';
                    unitQty = val / 1000;
                } else if (u === 'cl') {
                    if (!unitType) unitType = 'l';
                    unitQty = val / 100;
                }
            }

            if (!unitType || unitQty <= 0) {
                const titleWeightMatch = productName.match(/\b(\d+(?:[.,]\d+)?)\s*(G|GR|KG|ML|CL|L)\b/i);
                if (titleWeightMatch) {
                    const wVal = parseFloat(titleWeightMatch[1].replace(',', '.'));
                    const wUnit = titleWeightMatch[2].toUpperCase();
                    if (wUnit === 'G' || wUnit === 'GR') {
                        if (!unitType) unitType = 'kg';
                        if (unitQty <= 0) unitQty = wVal / 1000;
                    } else if (wUnit === 'KG') {
                        if (!unitType) unitType = 'kg';
                        if (unitQty <= 0) unitQty = wVal;
                    } else if (wUnit === 'ML') {
                        if (!unitType) unitType = 'l';
                        if (unitQty <= 0) unitQty = wVal / 1000;
                    } else if (wUnit === 'CL') {
                        if (!unitType) unitType = 'l';
                        if (unitQty <= 0) unitQty = wVal / 100;
                    } else if (wUnit === 'L') {
                        if (!unitType) unitType = 'l';
                        if (unitQty <= 0) unitQty = wVal;
                    }
                }
            }

            if (!unitType) unitType = 'pièce';
            if (unitQty <= 0) unitQty = 1.0;

            let baseUnitPrice = 0;
            let oldPrice = 0;

            const unitPriceMatch = fullText.match(/prix\s*(?:pi[eè]ce|pl[eè]ce|piece|pce|kg|l)?\s*[:.]?\s*(\d{1,3}[.,]\d{2})\s*€?/i);
            if (unitPriceMatch) {
                baseUnitPrice = parseFloat(unitPriceMatch[1].replace(',', '.'));
            }

            const decimalPrices = [...fullText.matchAll(/(\d{1,3}[.,]\d{2})\s*€/g)]
                .map(m => parseFloat(m[1].replace(',', '.')))
                .filter(p => p > 0 && p < 999);

            if (!baseUnitPrice && decimalPrices.length > 0) {
                baseUnitPrice = decimalPrices[0];
            }

            if (unitType === 'pièce' && Math.abs(unitQty - 1) < 0.01 && baseUnitPrice > 0) {
                oldPrice = baseUnitPrice;
            } else if (baseUnitPrice > 0 && unitQty > 0 && unitType !== 'pièce') {
                const computedPrice = Math.round(baseUnitPrice * unitQty * 100) / 100;
                const otherDecimal = decimalPrices.find(p => Math.abs(p - baseUnitPrice) > 0.02);
                oldPrice = otherDecimal || computedPrice;
            } else if (decimalPrices.length >= 2) {
                oldPrice = decimalPrices[decimalPrices.length - 1];
            }

            if (!oldPrice || oldPrice <= 0) {
                const bigPriceMatch = fullText.match(/€\s*(\d{3,4})\b/) || fullText.match(/\b(\d{1,2})\s*€\s*(\d{2})\b/);
                if (bigPriceMatch) {
                    if (bigPriceMatch[2]) {
                        oldPrice = parseFloat(`${bigPriceMatch[1]}.${bigPriceMatch[2]}`);
                    } else {
                        const rawDigits = bigPriceMatch[1];
                        oldPrice = parseFloat(rawDigits.slice(0, -2) + '.' + rawDigits.slice(-2));
                    }
                }
            }

            if (oldPrice > 0 && (!baseUnitPrice || baseUnitPrice <= 0)) {
                baseUnitPrice = unitQty > 0 ? Math.round((oldPrice / unitQty) * 100) / 100 : oldPrice;
            }

            let gencode = '';
            const compactLines = rawLines.map(l => l.replace(/\s+/g, ''));
            for (const cl of compactLines) {
                const eanMatch = cl.match(/(3\d{12}|5\d{12}|8\d{12}|[0-9]{13}|[0-9]{12})/);
                if (eanMatch && !cl.startsWith('00000000') && !cl.startsWith('90527')) {
                    gencode = eanMatch[1];
                    break;
                }
            }
            if (!gencode) {
                const allNumbers = [...fullText.matchAll(/\b(\d{12,13})\b/g)].map(m => m[1]);
                const validEan = allNumbers.find(n => !n.startsWith('00000000'));
                if (validEan) gencode = validEan;
            }

            const hasValidSignal = (oldPrice > 0) || (gencode.length >= 12) || /cont\s*[:.;]?/i.test(fullText);
            if (!hasValidSignal || (!productName && !gencode && oldPrice <= 0)) {
                return null;
            }

            return {
                productName: productName || 'PRODUIT',
                oldPrice: oldPrice > 0 ? oldPrice : 1.99,
                baseUnitPrice: baseUnitPrice > 0 ? baseUnitPrice : (oldPrice > 0 ? oldPrice : 1.99),
                unitQty: unitQty,
                unitType: unitType,
                gencode: gencode
            };
        }

        function sliceSheetInto3x7Grid(pageCanvas, textItems = []) {
            const w = pageCanvas.width;
            const h = pageCanvas.height;

            const topMargin = Math.round(h * 0.008);
            const bottomMargin = Math.round(h * 0.025);
            const leftMargin = Math.round(w * 0.005);
            const rightMargin = Math.round(w * 0.005);

            const gridW = w - leftMargin - rightMargin;
            const gridH = h - topMargin - bottomMargin;

            const cols = 3;
            const rows = 7;
            const cellW = gridW / cols;
            const cellH = gridH / rows;

            const cells = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cellX = leftMargin + c * cellW;
                    const cellY = topMargin + r * cellH;

                    const sx = Math.max(0, Math.floor(cellX));
                    const sy = Math.max(0, Math.floor(cellY));
                    const sw = Math.min(w - sx, Math.floor(cellW));
                    const sh = Math.min(h - sy, Math.floor(cellH));

                    const cellCanvas = document.createElement('canvas');
                    cellCanvas.width = Math.round(sw * 2.0);
                    cellCanvas.height = Math.round(sh * 2.0);
                    const ctx = cellCanvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, cellCanvas.width, cellCanvas.height);
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(pageCanvas, sx, sy, sw, sh, 0, 0, cellCanvas.width, cellCanvas.height);

                    const titleH = Math.round(sh * 0.16);
                    const titleW = Math.round(sw * 0.96);
                    const titleCanvas = document.createElement('canvas');
                    titleCanvas.width = Math.round(titleW * 2.5);
                    titleCanvas.height = Math.round(titleH * 2.5);
                    const tCtx = titleCanvas.getContext('2d');
                    tCtx.fillStyle = '#FFFFFF';
                    tCtx.fillRect(0, 0, titleCanvas.width, titleCanvas.height);
                    tCtx.drawImage(pageCanvas, sx, sy, titleW, titleH, 0, 0, titleCanvas.width, titleCanvas.height);

                    let nativeCellText = '';
                    let nativeTopLine = '';
                    if (textItems && textItems.length > 0) {
                        const inCell = textItems.filter(it =>
                            it.x >= cellX - 4 && it.x < cellX + cellW - 4 &&
                            it.y >= cellY - 4 && it.y < cellY + cellH - 4
                        );
                        inCell.sort((a, b) => (Math.abs(a.y - b.y) > 5 ? a.y - b.y : a.x - b.x));
                        let lines = [];
                        let curLine = [];
                        let lastY = null;
                        for (const it of inCell) {
                            if (lastY !== null && Math.abs(it.y - lastY) > 5) {
                                lines.push(curLine.join(' '));
                                curLine = [it.str];
                            } else {
                                curLine.push(it.str);
                            }
                            lastY = it.y;
                        }
                        if (curLine.length > 0) lines.push(curLine.join(' '));
                        nativeCellText = lines.join('\n');
                        if (lines.length > 0) nativeTopLine = lines[0];
                    }

                    cells.push({
                        row: r + 1,
                        col: c + 1,
                        dataUrl: cellCanvas.toDataURL('image/png'),
                        titleDataUrl: titleCanvas.toDataURL('image/png'),
                        nativeText: nativeCellText,
                        nativeTopLine: nativeTopLine
                    });
                }
            }
            return cells;
        }

        document.getElementById('inputBlueLabel').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const status = document.getElementById('ocrStatus');
            status.classList.remove('hidden');
            status.textContent = "⏳ Initialisation de l'analyse...";

            try {
                const worker = await Tesseract.createWorker('fra');
                let allDetected = [];

                for (const file of files) {
                    const pages = await loadFileToPages(file);

                    for (let p = 0; p < pages.length; p++) {
                        const pageCanvas = pages[p].canvas;
                        const textItems = pages[p].textItems;
                        const aspect = pageCanvas.height / pageCanvas.width;

                        if (aspect > 1.15) {
                            const cells = sliceSheetInto3x7Grid(pageCanvas, textItems);
                            const pageResults = [];

                            for (let idx = 0; idx < cells.length; idx++) {
                                const cell = cells[idx];
                                status.textContent = `⏳ Lecture case ${idx + 1} / ${cells.length} (Page ${p + 1})...`;

                                if (cell.nativeText && cell.nativeText.length > 15) {
                                    const parsed = parseSingleLabelBlock(cell.nativeText, cell.nativeTopLine);
                                    if (parsed) {
                                        pageResults.push(parsed);
                                    }
                                    continue;
                                }

                                const [fullRes, titleRes] = await Promise.all([
                                    worker.recognize(cell.dataUrl),
                                    worker.recognize(cell.titleDataUrl)
                                ]);

                                const parsed = parseSingleLabelBlock(fullRes.data.text, titleRes.data.text);
                                if (parsed) {
                                    pageResults.push(parsed);
                                }
                            }

                            allDetected = allDetected.concat(pageResults);
                        } else {
                            status.textContent = `⏳ Analyse de l'étiquette (${file.name})...`;
                            const { data } = await worker.recognize(pageCanvas.toDataURL('image/png'));
                            const single = parseSingleLabelBlock(data.text);
                            if (single) allDetected.push(single);
                        }
                    }
                }

                await worker.terminate();

                if (allDetected.length > 0) {
                    postersList = allDetected;
                    status.textContent = `✅ ${postersList.length} étiquette(s) extraite(s) et générée(s) !`;
                } else {
                    status.textContent = "⚠️ Aucune étiquette détectée sur le fichier.";
                }

                renderAllPosters();
            } catch (err) {
                console.error(err);
                status.textContent = "⚠️ Erreur lors de l'analyse du fichier.";
            }
        });

        function drawFormattedPrice(ctx, priceNumber, preferredCenterX, baselineY, isOldPrice, maxRightX = 656) {
            const priceStr = priceNumber.toFixed(2).replace('.', ',');
            const parts = priceStr.split(',');
            const euros = parts[0] || '0';
            const cents = parts[1] ? ',' + parts[1] : '';

            if (isOldPrice) {
                ctx.fillStyle = '#000000';
                const euroFont = euros.length >= 2 ? 56 : 62;
                const centFont = euros.length >= 2 ? 30 : 32;
                const symFont = euros.length >= 2 ? 25 : 28;

                ctx.font = `900 ${euroFont}px ${FONT_SLAB}`;
                const euroWidth = ctx.measureText(euros).width;

                ctx.font = `900 ${centFont}px ${FONT_SLAB}`;
                const centWidth = ctx.measureText(cents).width;

                const totalWidth = euroWidth + centWidth + 4;
                let startX = preferredCenterX - (totalWidth / 2);

                if (startX + totalWidth > maxRightX) {
                    startX = maxRightX - totalWidth;
                }
                if (startX < 420) startX = 420;

                ctx.textAlign = 'left';
                ctx.font = `900 ${euroFont}px ${FONT_SLAB}`;
                ctx.fillText(euros, startX, baselineY);

                ctx.font = `900 ${symFont}px ${FONT_SLAB}`;
                ctx.fillText('€', startX + euroWidth + 2, baselineY - (euros.length >= 2 ? 26 : 29));

                ctx.font = `900 ${centFont}px ${FONT_SLAB}`;
                ctx.fillText(cents, startX + euroWidth + 2, baselineY);

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.moveTo(startX - 5, baselineY - 5);
                ctx.lineTo(startX + totalWidth + 6, baselineY - 40);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#EE1C25';
                const isFourDigits = euros.length >= 2;
                const euroFont = isFourDigits ? 108 : 124;
                const centFont = isFourDigits ? 48 : 55;
                const symFont = isFourDigits ? 44 : 50;

                ctx.font = `900 ${euroFont}px ${FONT_SLAB}`;
                const euroWidth = ctx.measureText(euros).width;

                ctx.font = `900 ${centFont}px ${FONT_SLAB}`;
                const centWidth = ctx.measureText(cents).width;

                const totalWidth = euroWidth + centWidth + 4;
                let startX = preferredCenterX - (totalWidth / 2);

                if (startX + totalWidth > maxRightX) {
                    startX = maxRightX - totalWidth;
                }
                if (startX < 418) startX = 418;

                ctx.textAlign = 'left';
                ctx.font = `900 ${euroFont}px ${FONT_SLAB}`;
                ctx.fillText(euros, startX, baselineY);

                ctx.font = `900 ${symFont}px ${FONT_SLAB}`;
                ctx.fillText('€', startX + euroWidth + 3, baselineY - (isFourDigits ? 50 : 58));

                ctx.font = `900 ${centFont}px ${FONT_SLAB}`;
                ctx.fillText(cents, startX + euroWidth + 3, baselineY);
            }
        }

        function drawLeftZoneImage(ctx, img, zoneWidth, zoneHeight) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, zoneWidth, zoneHeight);
            ctx.clip();

            const scale = Math.max(zoneWidth / img.width, zoneHeight / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            ctx.drawImage(img, (zoneWidth - w) / 2, (zoneHeight - h) / 2, w, h);

            ctx.restore();
        }

        function drawFittedProductTitle(ctx, text, x, startY, maxWidth, maxBottomY) {
            const cleanText = (text || 'PRODUIT').toUpperCase().trim();

            function splitTokensForWrap(rawStr, maxW) {
                const spaceWords = rawStr.split(/\s+/);
                const finalTokens = [];

                for (const word of spaceWords) {
                    if (ctx.measureText(word).width <= maxW) {
                        finalTokens.push(word);
                    } else {
                        const subParts = word.split(/(?<=[/.])/);
                        if (subParts.length > 1) {
                            let accum = '';
                            for (const sp of subParts) {
                                if (accum && ctx.measureText(accum + sp).width > maxW) {
                                    finalTokens.push(accum);
                                    accum = sp;
                                } else {
                                    accum += sp;
                                }
                            }
                            if (accum) finalTokens.push(accum);
                        } else {
                            finalTokens.push(word);
                        }
                    }
                }
                return finalTokens;
            }

            for (let fontSize = 34; fontSize >= 17; fontSize -= 1) {
                const lineHeight = Math.round(fontSize * 1.18);
                ctx.font = `900 ${fontSize}px ${FONT_SLAB}`;

                const tokens = splitTokensForWrap(cleanText, maxWidth);
                const lines = [];
                let currentLine = '';
                let fitsHorizontally = true;

                for (let i = 0; i < tokens.length; i++) {
                    const token = tokens[i];
                    if (ctx.measureText(token).width > maxWidth) {
                        fitsHorizontally = false;
                        break;
                    }
                    const testLine = currentLine ? (currentLine + ' ' + token) : token;
                    if (ctx.measureText(testLine).width > maxWidth && currentLine !== '') {
                        lines.push(currentLine);
                        currentLine = token;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);

                const totalBottomY = startY + (lines.length - 1) * lineHeight;

                if (fitsHorizontally && totalBottomY <= maxBottomY) {
                    lines.forEach((line, idx) => {
                        ctx.fillText(line, x, startY + idx * lineHeight);
                    });
                    return;
                }
            }

            const fallbackSize = 16;
            const fallbackLH = 19;
            ctx.font = `900 ${fallbackSize}px ${FONT_SLAB}`;
            let curY = startY;
            let curLine = '';
            for (const ch of cleanText) {
                if (ctx.measureText(curLine + ch).width > maxWidth) {
                    ctx.fillText(curLine, x, curY);
                    curLine = ch;
                    curY += fallbackLH;
                } else {
                    curLine += ch;
                }
            }
            if (curLine) ctx.fillText(curLine, x, curY);
        }

        function drawVisualBarcode(ctx, gencode, x, y, maxWidth) {
            const cleanCode = (gencode || '').replace(/\s+/g, '');
            if (!cleanCode) return;

            const bcCanvas = document.createElement('canvas');
            try {
                const isEan13 = /^\d{13}$/.test(cleanCode);
                try {
                    JsBarcode(bcCanvas, cleanCode, {
                        format: isEan13 ? "EAN13" : "CODE128",
                        width: 2.2,
                        height: 44,
                        displayValue: true,
                        fontSize: 18,
                        fontOptions: "bold",
                        font: "Montserrat, Arial, sans-serif",
                        textMargin: 2,
                        margin: 0,
                        background: "#FFFFFF",
                        lineColor: "#000000"
                    });
                } catch (eanErr) {
                    JsBarcode(bcCanvas, cleanCode, {
                        format: "CODE128",
                        width: 2.0,
                        height: 44,
                        displayValue: true,
                        fontSize: 18,
                        fontOptions: "bold",
                        font: "Montserrat, Arial, sans-serif",
                        textMargin: 2,
                        margin: 0,
                        background: "#FFFFFF",
                        lineColor: "#000000"
                    });
                }

                const targetW = Math.min(maxWidth, bcCanvas.width);
                const targetH = bcCanvas.height * (targetW / bcCanvas.width);
                ctx.drawImage(bcCanvas, x, y - targetH + 6, targetW, targetH);
            } catch (err) {
                ctx.fillStyle = '#000000';
                ctx.font = `700 19px ${FONT_SANS}`;
                ctx.textAlign = 'left';
                ctx.fillText(cleanCode, x, y);
            }
        }

        function drawSinglePoster(canvas, item) {
            const ctx = canvas.getContext('2d');
            const discountInput = document.getElementById('inputDiscount').value.trim();
            const discountMatch = discountInput.match(/(\d+(?:[.,]\d+)?)\s*%/);
            const pct = discountMatch ? parseFloat(discountMatch[1].replace(',', '.')) : 0;

            const newPrice = item.oldPrice * (1 - pct / 100);
            let unitPriceText = '';
            const uType = item.unitType || 'pièce';
            const prefix = uType === 'pièce' ? 'La pièce' : (uType === 'l' ? 'Le L' : 'Le kg');

            if (item.baseUnitPrice > 0) {
                const newUnitVal = item.baseUnitPrice * (1 - pct / 100);
                unitPriceText = `${prefix} : ${newUnitVal.toFixed(2).replace('.', ',')} €`;
            } else if (item.unitQty > 0) {
                const newUnitVal = newPrice / item.unitQty;
                unitPriceText = `${prefix} : ${newUnitVal.toFixed(2).replace('.', ',')} €`;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Fond blanc
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Zone Rouge Gauche
            const leftWidth = 412;
            ctx.fillStyle = '#EE1C25';
            ctx.fillRect(0, 0, leftWidth, canvas.height);

            const activeImg = document.getElementById('chkAutoTrim').checked ? (trimmedLeftImage || rawLeftImage) : rawLeftImage;
            if (activeImg && activeImg.complete) {
                drawLeftZoneImage(ctx, activeImg, leftWidth, canvas.height);
            }

            // Dates (si affichées)
            const dateRaw = document.getElementById('inputDates').value.trim();
            if (showDate && dateRaw) {
                const dateLines = dateRaw.split('|').map(s => s.trim());
                ctx.fillStyle = dateColor;
                ctx.font = `500 18px ${FONT_SLAB}`;
                ctx.textAlign = 'center';
                dateLines.forEach((line, index) => {
                    ctx.fillText(line, leftWidth / 2, 35 + (index * 22));
                });
            }

            // 3. Cercle Mécanique Promo
            const circleX = 782;
            const circleY = 185;
            const radius = 114;

            ctx.fillStyle = '#EE1C25';
            ctx.beginPath();
            ctx.arc(circleX, circleY, radius, 0, Math.PI * 2);
            ctx.fill();

            const discountStr = discountInput;
            const rawDiscText = document.getElementById('inputDiscountText').value.trim();
            const hasDiscPhrase = showDiscountText && rawDiscText.length > 0;
            const mainYOffset = hasDiscPhrase ? 2 : 26;

            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';

            if (discountStr.endsWith('%')) {
                const numPart = discountStr.slice(0, -1);
                const mainFontSize = hasDiscPhrase ? 74 : 84;
                const pctFontSize = hasDiscPhrase ? 42 : 48;

                ctx.font = `900 ${mainFontSize}px ${FONT_SLAB}`;
                const numW = ctx.measureText(numPart).width;
                ctx.font = `900 ${pctFontSize}px ${FONT_SLAB}`;
                const pctW = ctx.measureText('%').width;

                const startX = circleX - ((numW + pctW) / 2);
                ctx.textAlign = 'left';
                ctx.font = `900 ${mainFontSize}px ${FONT_SLAB}`;
                ctx.fillText(numPart, startX, circleY + mainYOffset);

                ctx.font = `900 ${pctFontSize}px ${FONT_SLAB}`;
                ctx.fillText('%', startX + numW + 2, circleY + mainYOffset - 26);
            } else {
                const customFontSize = discountStr.length > 7 ? 42 : (hasDiscPhrase ? 64 : 74);
                ctx.font = `900 ${customFontSize}px ${FONT_SLAB}`;
                ctx.textAlign = 'center';
                ctx.fillText(discountStr, circleX, circleY + mainYOffset);
            }

            if (hasDiscPhrase) {
                const discTextLines = rawDiscText.split('|');
                ctx.font = `700 21px ${FONT_SLAB}`;
                ctx.textAlign = 'center';
                discTextLines.forEach((line, idx) => {
                    ctx.fillText(line.trim(), circleX, circleY + 32 + (idx * 24));
                });
            }

            // 4. Prix (Ancien prix barré + Nouveau prix remisé)
            const priceCenterX = 550;
            const maxPriceRightX = circleX - radius - 12;
            drawFormattedPrice(ctx, item.oldPrice, priceCenterX + 15, 168, true, maxPriceRightX);
            drawFormattedPrice(ctx, newPrice, priceCenterX, 270, false, maxPriceRightX);

            ctx.fillStyle = '#EE1C25';
            ctx.font = `800 15px ${FONT_SANS}`;
            ctx.textAlign = 'center';
            ctx.fillText(document.getElementById('inputUnitLabel').value.toUpperCase(), priceCenterX + 5, 300);

            ctx.fillStyle = '#000000';
            ctx.font = `600 15px ${FONT_SANS}`;
            ctx.fillText(unitPriceText, priceCenterX + 5, 320);

            // 5. Nom du produit à droite
            const rightX = 912;
            const maxRightWidth = 268;
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'left';

            drawFittedProductTitle(ctx, item.productName, rightX, 68, maxRightWidth, 315);

            // 6. Bas de l'étiquette (Mention d'ouverture + Code-barres visuel)
            if (showDate && dateRaw.includes('*')) {
                ctx.fillStyle = '#000000';
                ctx.font = `500 12px ${FONT_SANS}`;
                ctx.textAlign = 'left';
                ctx.fillText("* Selon jour d'ouverture de votre magasin", 422, 396);
            }

            if (item.gencode) {
                drawVisualBarcode(ctx, item.gencode, rightX, 398, 260);
            }
        }

        function renderAllPosters() {
            const container = document.getElementById('postersContainer');
            container.innerHTML = '';

            document.getElementById('badgeCount').textContent = `${postersList.length} étiquette${postersList.length > 1 ? 's' : ''}`;

            postersList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl shadow-md space-y-3';

                const header = document.createElement('div');
                header.className = 'flex flex-wrap items-center border-b pb-2 gap-2';
                header.innerHTML = `
                    <span class="bg-gray-800 text-white text-xs font-bold px-2.5 py-1 rounded">
                        #${index + 1}
                    </span>
                    <input type="text" data-idx="${index}" data-field="productName" value="${item.productName.replace(/"/g, '&quot;')}" 
                        class="poster-edit-input flex-1 min-w-[200px] text-xs font-bold uppercase border rounded px-2.5 py-1 text-gray-800 focus:ring-2 focus:ring-red-500"
                        title="Nom du produit (1re ligne)" placeholder="Nom du produit" />
                    <label class="flex items-center gap-1 text-xs font-semibold text-gray-600">
                        Prix (€):
                        <input type="number" step="0.01" data-idx="${index}" data-field="oldPrice" value="${item.oldPrice.toFixed(2)}" 
                            class="poster-edit-input w-20 text-xs font-bold border rounded px-2 py-1 text-pink-700 bg-pink-50" />
                    </label>
                    <label class="flex items-center gap-1 text-xs font-semibold text-gray-600">
                        Prix Unité (€):
                        <input type="number" step="0.01" data-idx="${index}" data-field="baseUnitPrice" value="${(item.baseUnitPrice || item.oldPrice).toFixed(2)}" 
                            class="poster-edit-input w-20 text-xs font-bold border rounded px-2 py-1 text-amber-800 bg-amber-50" title="Prix au kg, au litre ou à la pièce avant remise" />
                    </label>
                    <label class="flex items-center gap-1 text-xs font-semibold text-gray-600">
                        Unité:
                        <select data-idx="${index}" data-field="unitType" class="poster-edit-input text-xs font-bold border rounded px-1.5 py-1 bg-yellow-50 text-yellow-900">
                            <option value="pièce" ${item.unitType === 'pièce' ? 'selected' : ''}>Pièce</option>
                            <option value="kg" ${item.unitType === 'kg' ? 'selected' : ''}>Kg</option>
                            <option value="l" ${item.unitType === 'l' ? 'selected' : ''}>Litre</option>
                        </select>
                    </label>
                    <label class="flex items-center gap-1 text-xs font-semibold text-gray-600">
                        EAN:
                        <input type="text" data-idx="${index}" data-field="gencode" value="${item.gencode || ''}" 
                            class="poster-edit-input w-32 text-xs font-bold border rounded px-2 py-1 text-blue-800 bg-blue-50" placeholder="Code-barres" />
                    </label>
                `;

                const canvasWrapper = document.createElement('div');
                canvasWrapper.className = 'overflow-x-auto w-full flex justify-center border border-gray-200 bg-gray-100 p-4 rounded-lg';

                const canvas = document.createElement('canvas');
                canvas.width = 1200;
                canvas.height = 420;
                canvas.id = `posterCanvas_${index}`;
                canvas.className = 'max-w-full h-auto shadow-md bg-white';

                canvasWrapper.appendChild(canvas);
                card.appendChild(header);
                card.appendChild(canvasWrapper);
                container.appendChild(card);

                drawSinglePoster(canvas, item);
            });

            document.querySelectorAll('.poster-edit-input').forEach(input => {
                input.addEventListener('input', function() {
                    const idx = parseInt(this.getAttribute('data-idx'), 10);
                    const field = this.getAttribute('data-field');
                    if (field === 'productName') {
                        postersList[idx].productName = this.value.toUpperCase();
                    } else if (field === 'oldPrice') {
                        const val = parseFloat(this.value) || 0;
                        postersList[idx].oldPrice = val;
                        if (postersList[idx].unitType === 'pièce') {
                            postersList[idx].baseUnitPrice = val;
                        }
                    } else if (field === 'baseUnitPrice') {
                        postersList[idx].baseUnitPrice = parseFloat(this.value) || 0;
                    } else if (field === 'unitType') {
                        postersList[idx].unitType = this.value;
                    } else if (field === 'gencode') {
                        postersList[idx].gencode = this.value.trim();
                    }
                    const c = document.getElementById(`posterCanvas_${idx}`);
                    if (c) drawSinglePoster(c, postersList[idx]);
                });
            });
        }

        // EXPORT PDF A4 PORTRAIT : 4 étiquettes par page
        document.getElementById('btnDownloadPdfA4').addEventListener('click', async function() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            
            const pageWidth = 210;
            const pageHeight = 297;
            const posterHeightMm = pageHeight / 4;
            const maxPerPage = 4;

            for (let i = 0; i < postersList.length; i++) {
                const pageIndex = Math.floor(i / maxPerPage);
                const posOnPage = i % maxPerPage;

                if (pageIndex > 0 && posOnPage === 0) {
                    pdf.addPage();
                }

                const canvas = document.getElementById(`posterCanvas_${i}`);
                if (!canvas) continue;

                const imgData = canvas.toDataURL('image/jpeg', 0.98);
                const posY = posOnPage * posterHeightMm;

                pdf.addImage(imgData, 'JPEG', 0, posY, pageWidth, posterHeightMm);
            }

            pdf.save('grandes_etiquettes_promo_A4.pdf');
        });

        ['inputDates', 'inputDiscount', 'inputDiscountText', 'inputUnitLabel'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                postersList.forEach((item, idx) => {
                    const c = document.getElementById(`posterCanvas_${idx}`);
                    if (c) drawSinglePoster(c, item);
                });
            });
        });

        document.fonts.ready.then(() => {
            renderAllPosters();
        });
        window.onload = renderAllPosters;
    </script>
</body>
</html>
